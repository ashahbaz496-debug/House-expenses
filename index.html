<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Construction Expense Tracker</title>
    <!-- jsPDF Libraries for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #eef2f7; padding: 15px; border-radius: 8px; text-align: center; }
        .card h3 { margin: 0; color: #555; }
        .card p { font-size: 24px; font-weight: bold; color: #27ae60; margin: 10px 0 0 0; }
        
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        form input, form select, form button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .full-width { grid-column: span 2; }
        form button { background: #2980b9; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        form button:hover { background: #3498db; }
        
        .calc-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; grid-column: span 2; background: #eaeaea; padding: 10px; border-radius: 5px; }
        .calc-group label { font-size: 12px; font-weight: bold; color: #555; grid-column: span 2; }

        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f1f1f1; padding: 10px; border-radius: 5px; flex-wrap: wrap; gap: 10px; }
        .pdf-group { display: flex; gap: 8px; align-items: center; }
        .pdf-group select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        
        .btn { border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .export-btn { background: #27ae60; }
        .export-btn:hover { background: #219150; }
        .pdf-btn { background: #e67e22; }
        .pdf-btn:hover { background: #d35400; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .loading { text-align: center; font-style: italic; color: #777; margin: 15px 0; }

        .by-line { text-align: center; margin-top: 20px; font-weight: bold; color: #555; border-top: 1px solid #ddd; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 Home Construction Expenses</h1>

    <div class="grid">
        <div class="card">
            <h3>Total Spent</h3>
            <p id="totalSpent">Rs 0.00</p>
        </div>
        <div class="card">
            <h3>Total Entries</h3>
            <p id="totalEntries" style="color: #2980b9;">0</p>
        </div>
    </div>

    <!-- ADD EXPENSE FORM -->
    <form id="expenseForm">
        <input type="text" id="date" placeholder="DD/MM/YYYY" maxlength="10" required onclick="selectDaySegment(this)">
        
        <select id="category" class="shortcut-select" onchange="handleCategoryChange(this)" required>
            <option value="">Select Category</option>
            <option value="Foundation & Structure">Foundation & Structure</option>
            <option value="Cement & Bricks">Cement & Bricks</option>
            <option value="Labor">Labor</option>
            <option value="Plumbing & Electrical">Plumbing & Electrical</option>
            <option value="Finishing & Paint">Finishing & Paint</option>
            <option value="Permits & Legal">Permits & Legal</option>
            <option value="Other">Other</option>
            <option value="NEW_CATEGORY">➕ Add Custom Category...</option>
        </select>
        
        <div class="calc-group">
            <label>📐 Optional Unit/Rate Calculator (Qty × Rate = Total Amount)</label>
            <input type="number" id="qty" placeholder="Quantity / Pieces (Optional)" step="any" oninput="calculateTotal()">
            <input type="number" id="rate" placeholder="Rate Per Piece in Rs (Optional)" step="any" oninput="calculateTotal()">
        </div>

        <input type="number" id="amount" class="full-width" placeholder="Total Amount (Rs)" step="0.01" required>
        <button type="submit" id="submitBtn" class="full-width">Add Expense</button>
    </form>

    <!-- EXPORT & PDF TOOLBAR -->
    <div class="actions-bar">
        <button class="btn export-btn" onclick="exportToCSV()">📥 Export CSV</button>
        
        <div class="pdf-group">
            <select id="pdfCategoryFilter">
                <option value="ALL">All Categories</option>
                <option value="Foundation & Structure">Foundation & Structure</option>
                <option value="Cement & Bricks">Cement & Bricks</option>
                <option value="Labor">Labor</option>
                <option value="Plumbing & Electrical">Plumbing & Electrical</option>
                <option value="Finishing & Paint">Finishing & Paint</option>
                <option value="Permits & Legal">Permits & Legal</option>
                <option value="Other">Other</option>
            </select>
            <button class="btn pdf-btn" onclick="generatePDF()">📄 Generate Category PDF</button>
        </div>
    </div>

    <div id="status" class="loading">Syncing with Google Sheet...</div>

    <table>
        <thead>
            <tr>
                <th>Date (DD/MM/YYYY)</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Rate / Piece (Rs)</th>
                <th>Total Amount</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody"></tbody>
    </table>

    <div class="by-line">CREATED BY AHMAD</div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziPhATcbMdyfi2xbWCVmGm032Lm2HQ-iT3-CMW7jetzKCLZtcdud9WOveoim6hwbac/exec";

    let rawExpenses = [];

    function getTodayDMY() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
    }

    const dateInput = document.getElementById('date');
    dateInput.value = getTodayDMY();

    function focusDateInput() {
        dateInput.focus();
        if (dateInput.value.length === 10) {
            dateInput.setSelectionRange(0, 2);
        }
    }

    function selectDaySegment(inputEl) {
        if (inputEl.value.length === 10) {
            inputEl.setSelectionRange(0, 2);
        }
    }

    function setupDateAutoFormat(inputId) {
        const el = document.getElementById(inputId);
        el.addEventListener('keydown', function(e) {
            if (e.key === '/' || e.key === 'ArrowRight') {
                const cursorPos = el.selectionStart;
                if (cursorPos <= 2) {
                    e.preventDefault();
                    el.setSelectionRange(3, 5);
                } else if (cursorPos <= 5) {
                    e.preventDefault();
                    el.setSelectionRange(6, 10);
                }
            }
        });
    }

    setupDateAutoFormat('date');

    function formatDateDMY(rawDateStr) {
        if (!rawDateStr) return '';
        const cleanStr = String(rawDateStr).substring(0, 10);
        if (cleanStr.includes('-')) {
            const parts = cleanStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return cleanStr;
    }

    function parseDetails(description) {
        if (!description) return { qty: '-', rate: '-' };
        const match = description.match(/([\d\.]+)\s*pcs\s*@\s*Rs\s*([\d\.]+)\/pc/i);
        if (match) {
            return { qty: match[1], rate: match[2] };
        }
        return { qty: '-', rate: '-' };
    }

    function calculateTotal() {
        const qty = parseFloat(document.getElementById('qty').value) || 0;
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        if (qty > 0 && rate > 0) {
            document.getElementById('amount').value = (qty * rate).toFixed(2);
        }
    }

    function handleCategoryChange(selectObj) {
        if (selectObj.value === "NEW_CATEGORY") {
            const customCat = prompt("Enter new category name:");
            if (customCat && customCat.trim() !== "") {
                const newName = customCat.trim();
                
                // Add option to entry dropdown
                const opt = document.createElement("option");
                opt.value = newName;
                opt.text = newName;
                opt.selected = true;
                selectObj.add(opt, selectObj.options[selectObj.options.length - 1]);

                // Add option to PDF Filter dropdown as well
                const pdfOpt = document.createElement("option");
                pdfOpt.value = newName;
                pdfOpt.text = newName;
                document.getElementById('pdfCategoryFilter').add(pdfOpt);
            } else {
                selectObj.value = "";
            }
        }
    }

    function loadExpenses() {
        document.getElementById('status').innerText = "Syncing with Google Sheet...";
        
        const oldScript = document.getElementById('jsonpScript');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'jsonpScript';
        script.src = `${SCRIPT_URL}?callback=handleData&_=${new Date().getTime()}`;
        document.body.appendChild(script);
    }

    function handleData(data) {
        rawExpenses = data;
        updateTable();
        document.getElementById('status').innerText = "";
    }

    function updateTable() {
        const tableBody = document.getElementById('expenseTableBody');
        tableBody.innerHTML = '';
        let total = 0;

        rawExpenses.forEach((item, index) => {
            const amt = parseFloat(item.amount || 0);
            total += amt;

            const formattedDate = formatDateDMY(item.date);
            const details = parseDetails(item.description);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${formattedDate}</td>
                <td>${item.category}</td>
                <td>${details.qty}</td>
                <td>${details.rate !== '-' ? 'Rs ' + parseFloat(details.rate).toLocaleString(undefined, {minimumFractionDigits: 2}) : '-'}</td>
                <td>Rs ${amt.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('totalSpent').innerText = `Rs ${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('totalEntries').innerText = rawExpenses.length;
    }

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";

        const qtyVal = document.getElementById('qty').value;
        const rateVal = document.getElementById('rate').value;
        let autoDesc = (qtyVal && rateVal) ? `${qtyVal} pcs @ Rs ${rateVal}/pc` : "";

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = SCRIPT_URL;
        form.target = 'hidden_iframe';

        const fields = {
            date: document.getElementById('date').value,
            category: document.getElementById('category').value,
            description: autoDesc,
            amount: document.getElementById('amount').value
        };

        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        document.getElementById('qty').value = '';
        document.getElementById('rate').value = '';
        document.getElementById('amount').value = '';

        setTimeout(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Add Expense";
            loadExpenses();
            focusDateInput();
        }, 2000);
    });

    function deleteExpense(index) {
        if (!confirm("Are you sure you want to delete this item?")) return;
        
        document.getElementById('status').innerText = "Deleting...";

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = SCRIPT_URL;
        form.target = 'hidden_iframe';

        const fields = { action: "delete", index: index };
        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(loadExpenses, 2000);
    }

    function exportToCSV() {
        if (rawExpenses.length === 0) {
            alert("No data to export!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Date (DD/MM/YYYY),Category,Quantity,Rate Per Piece (Rs),Total Amount (Rs)\n";
        rawExpenses.forEach(e => {
            const formattedDate = formatDateDMY(e.date);
            const details = parseDetails(e.description);
            csvContent += `"${formattedDate}","${e.category}","${details.qty}","${details.rate}","${e.amount}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `construction_expenses.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // PDF GENERATOR BY CATEGORY FUNCTION
    function generatePDF() {
        if (rawExpenses.length === 0) {
            alert("No data available to generate PDF!");
            return;
        }

        const selectedCategory = document.getElementById('pdfCategoryFilter').value;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Filter items
        let filteredExpenses = rawExpenses;
        if (selectedCategory !== "ALL") {
            filteredExpenses = rawExpenses.filter(item => item.category === selectedCategory);
        }

        if (filteredExpenses.length === 0) {
            alert(`No expenses found for category: ${selectedCategory}`);
            return;
        }

        // Header Title
        doc.setFontSize(18);
        doc.text("Home Construction Expense Report", 14, 20);
        
        doc.setFontSize(11);
        doc.setTextColor(100);
        doc.text(`Category: ${selectedCategory}`, 14, 28);
        doc.text(`Generated On: ${getTodayDMY()}`, 14, 34);

        // Build PDF Table Rows
        let tableRows = [];
        let categoryTotal = 0;

        filteredExpenses.forEach(item => {
            const amt = parseFloat(item.amount || 0);
            categoryTotal += amt;
            const details = parseDetails(item.description);
            
            tableRows.push([
                formatDateDMY(item.date),
                item.category,
                details.qty,
                details.rate !== '-' ? `Rs ${parseFloat(details.rate).toFixed(2)}` : '-',
                `Rs ${amt.toFixed(2)}`
            ]);
        });

        // Add Summary Row
        tableRows.push([
            { content: 'Total', colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } },
            { content: `Rs ${categoryTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}`, styles: { fontStyle: 'bold' } }
        ]);

        // Draw Table
        doc.autoTable({
            startY: 40,
            head: [['Date', 'Category', 'Qty', 'Rate / Piece', 'Total Amount']],
            body: tableRows,
            theme: 'striped',
            headStyles: { fillColor: [52, 73, 94] }
        });

        // Save PDF
        const fileName = selectedCategory === "ALL" 
            ? "Construction_Expenses_All.pdf" 
            : `Construction_Expenses_${selectedCategory.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`;

        doc.save(fileName);
    }

    loadExpenses();
</script>

</body>
</html>
