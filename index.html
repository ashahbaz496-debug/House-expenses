<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Construction Expense Tracker</title>
    <!-- Flatpickr CSS for custom DD/MM/YYYY datepicker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #eef2f7; padding: 15px; border-radius: 8px; text-align: center; }
        .card h3 { margin: 0; color: #555; }
        .card p { font-size: 24px; font-weight: bold; color: #27ae60; margin: 10px 0 0 0; }
        
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        form input, form select, form button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .full-width { grid-column: span 2; }
        form button { background: #2980b9; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        form button:hover { background: #3498db; }
        
        .calc-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; grid-column: span 2; background: #eaeaea; padding: 10px; border-radius: 5px; }
        .calc-group label { font-size: 12px; font-weight: bold; color: #555; grid-column: span 2; }

        .filter-section { background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: center; }
        .filter-grid label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
        .filter-grid input, .filter-grid select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 100%; background: white; }
        .reset-btn { background: #7f8c8d; color: white; border: none; padding: 9px 15px; border-radius: 5px; cursor: pointer; height: 36px; margin-top: 15px; }

        .summary-box { background: #fcf8e3; border: 1px solid #faebcc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .summary-box h3 { margin-top: 0; color: #8a6d3b; }
        .summary-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .summary-item { background: white; padding: 10px; border-radius: 5px; border: 1px solid #e3e3e3; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .loading { text-align: center; font-style: italic; color: #777; margin: 15px 0; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
        .btn-group { display: flex; gap: 10px; }
        .export-btn { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .pdf-btn { background: #8e44ad; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .export-btn:hover { background: #219150; }
        .pdf-btn:hover { background: #71368a; }

        .by-line { text-align: center; margin-top: 20px; font-weight: bold; color: #555; border-top: 1px solid #ddd; padding-top: 15px; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; }
            form, .filter-section, .delete-btn, .action-bar, .loading { display: none !important; }
            th:last-child, td:last-child { display: none !important; }
            .by-line { display: block !important; margin-top: 30px; font-size: 16px; border-top: 2px solid #333; }
            h1::before { content: "EXPENSES SUMMARY REPORT - "; }
        }

        @media (max-width: 700px) {
            .grid, form, .filter-grid, .calc-group { grid-template-columns: 1fr; }
            .full-width, form button, .calc-group label { grid-column: span 1; }
            .reset-btn { margin-top: 0; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 Home Construction Expenses</h1>

    <div class="grid">
        <div class="card">
            <h3>Total Spent (Filtered)</h3>
            <p id="totalSpent">Rs 0.00</p>
        </div>
        <div class="card">
            <h3>Total Entries</h3>
            <p id="totalEntries" style="color: #2980b9;">0</p>
        </div>
    </div>

    <!-- ADD EXPENSE FORM -->
    <form id="expenseForm">
        <input type="text" id="date" placeholder="DD/MM/YYYY" required>
        <select id="category" class="shortcut-select" onchange="handleCategoryChange(this)" required>
            <option value="">Select Category</option>
            <option value="Foundation & Structure">Foundation & Structure</option>
            <option value="Cement & Bricks">Cement & Bricks</option>
            <option value="Labor">Labor</option>
            <option value="Plumbing & Electrical">Plumbing & Electrical</option>
            <option value="Finishing & Paint">Finishing & Paint</option>
            <option value="Permits & Legal">Permits & Legal</option>
            <option value="Other">Other</option>
            <option value="NEW_CATEGORY">➕ Add Custom Category...</option>
        </select>
        
        <!-- Rate Calculator Section -->
        <div class="calc-group">
            <label>📐 Optional Unit/Rate Calculator (Qty × Rate = Total Amount)</label>
            <input type="number" id="qty" placeholder="Quantity / Pieces" step="any" oninput="calculateTotal()">
            <input type="number" id="rate" placeholder="Rate Per Piece (Rs)" step="any" oninput="calculateTotal()">
        </div>

        <input type="number" id="amount" class="full-width" placeholder="Total Amount (Rs)" step="0.01" required>
        <button type="submit" id="submitBtn" class="full-width">Add Expense</button>
    </form>

    <!-- FILTER & VERIFICATION SECTION -->
    <div class="filter-section">
        <h3>🔍 Filter Data by Category & Date Range</h3>
        <div class="filter-grid">
            <div>
                <label>Category</label>
                <select id="filterCategory" class="shortcut-select" onchange="applyFilters()">
                    <option value="ALL">All Categories</option>
                    <option value="Foundation & Structure">Foundation & Structure</option>
                    <option value="Cement & Bricks">Cement & Bricks</option>
                    <option value="Labor">Labor</option>
                    <option value="Plumbing & Electrical">Plumbing & Electrical</option>
                    <option value="Finishing & Paint">Finishing & Paint</option>
                    <option value="Permits & Legal">Permits & Legal</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label>From Date (DD/MM/YYYY)</label>
                <input type="text" id="filterFromDate" placeholder="DD/MM/YYYY" onchange="applyFilters()">
            </div>
            <div>
                <label>To Date (DD/MM/YYYY)</label>
                <input type="text" id="filterToDate" placeholder="DD/MM/YYYY" onchange="applyFilters()">
            </div>
            <div>
                <button class="reset-btn" onclick="resetFilters()">Reset Filters</button>
            </div>
        </div>
    </div>

    <!-- CATEGORY SUMMARY BREAKDOWN -->
    <div class="summary-box">
        <h3>📊 Category Breakdown (Verification)</h3>
        <div id="categorySummary" class="summary-list"></div>
    </div>

    <div class="action-bar">
        <h3>📋 Itemized Record List</h3>
        <div class="btn-group">
            <button class="pdf-btn" onclick="generatePDF()">📄 Save / Print as PDF</button>
            <button class="export-btn" onclick="exportToCSV()">📥 Export to CSV</button>
        </div>
    </div>

    <div id="status" class="loading">Loading expenses from Google Sheet...</div>

    <table>
        <thead>
            <tr>
                <th>Date (DD/MM/YYYY)</th>
                <th>Category</th>
                <th>Amount</th>
                <th class="action-col">Action</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody"></tbody>
    </table>

    <div class="by-line">CREATED BY AHMAD</div>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJwX1Azql-Op5hrukxI2wPiCz6lzB6oiesMRyoQSq_AhNviSzrIkAoaQqsLrrk4Ae0/exec";

    let rawExpenses = [];
    let filteredExpenses = [];

    // Initialize Flatpickr inputs with strict DD/MM/YYYY format
    const datePicker = flatpickr("#date", {
        dateFormat: "d/m/Y",
        defaultDate: new Date()
    });

    const fromPicker = flatpickr("#filterFromDate", {
        dateFormat: "d/m/Y",
        onChange: function() { applyFilters(); }
    });

    const toPicker = flatpickr("#filterToDate", {
        dateFormat: "d/m/Y",
        onChange: function() { applyFilters(); }
    });

    // Converts date strings into DD/MM/YYYY format
    function formatDateDMY(rawDateStr) {
        if (!rawDateStr) return '';
        const cleanStr = String(rawDateStr).substring(0, 10);
        if (cleanStr.includes('-')) {
            const parts = cleanStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        }
        return rawDateStr;
    }

    // Helper to get comparable YYYY-MM-DD for filter logic
    function toISODate(dmyStr) {
        if (!dmyStr) return '';
        if (dmyStr.includes('/')) {
            const parts = dmyStr.split('/');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
        }
        return dmyStr.substring(0, 10);
    }

    // Hover Keyboard Shortcut Handler for Category Selection
    let hoveredSelect = null;
    document.querySelectorAll('.shortcut-select').forEach(selectEl => {
        selectEl.addEventListener('mouseenter', () => { hoveredSelect = selectEl; });
        selectEl.addEventListener('mouseleave', () => { hoveredSelect = null; });
    });

    window.addEventListener('keydown', (e) => {
        if (hoveredSelect && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
            const pressedKey = e.key.toLowerCase();
            for (let i = 0; i < hoveredSelect.options.length; i++) {
                const optText = hoveredSelect.options[i].text.trim().toLowerCase();
                if (optText.startsWith(pressedKey)) {
                    hoveredSelect.selectedIndex = i;
                    hoveredSelect.dispatchEvent(new Event('change'));
                    break;
                }
            }
        }
    });

    function calculateTotal() {
        const qty = parseFloat(document.getElementById('qty').value) || 0;
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        if (qty > 0 && rate > 0) {
            document.getElementById('amount').value = (qty * rate).toFixed(2);
        }
    }

    function handleCategoryChange(selectObj) {
        if (selectObj.value === "NEW_CATEGORY") {
            const customCat = prompt("Enter new category name:");
            if (customCat && customCat.trim() !== "") {
                const newName = customCat.trim();
                
                const opt = document.createElement("option");
                opt.value = newName;
                opt.text = newName;
                opt.selected = true;
                selectObj.add(opt, selectObj.options[selectObj.options.length - 1]);

                const filterSelect = document.getElementById('filterCategory');
                const filterOpt = document.createElement("option");
                filterOpt.value = newName;
                filterOpt.text = newName;
                filterSelect.add(filterOpt);
            } else {
                selectObj.value = "";
            }
        }
    }

    function loadExpenses() {
        document.getElementById('status').innerText = "Syncing with Google Sheet...";
        
        const oldScript = document.getElementById('jsonp-fetch');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'jsonp-fetch';
        script.src = `${SCRIPT_URL}?callback=handleData`;
        
        script.onerror = function() {
            document.getElementById('status').innerText = "Error syncing with Google Sheet.";
        };
        
        document.body.appendChild(script);
    }

    function handleData(data) {
        rawExpenses = data;
        applyFilters();
        document.getElementById('status').innerText = "";
    }

    function applyFilters() {
        const category = document.getElementById('filterCategory').value;
        const fromDateISO = toISODate(document.getElementById('filterFromDate').value);
        const toDateISO = toISODate(document.getElementById('filterToDate').value);

        filteredExpenses = rawExpenses.filter(item => {
            const itemDateISO = item.date ? String(item.date).substring(0, 10) : '';
            const categoryMatch = (category === 'ALL' || item.category === category);
            const fromMatch = !fromDateISO || (itemDateISO >= fromDateISO);
            const toMatch = !toDateISO || (itemDateISO <= toDateISO);

            return categoryMatch && fromMatch && toMatch;
        });

        updateUI();
    }

    function resetFilters() {
        document.getElementById('filterCategory').value = 'ALL';
        fromPicker.clear();
        toPicker.clear();
        applyFilters();
    }

    function updateUI() {
        const tableBody = document.getElementById('expenseTableBody');
        tableBody.innerHTML = '';
        let total = 0;
        let categoryTotals = {};

        filteredExpenses.forEach((item, index) => {
            const amt = parseFloat(item.amount || 0);
            total += amt;

            if (!categoryTotals[item.category]) {
                categoryTotals[item.category] = 0;
            }
            categoryTotals[item.category] += amt;

            const formattedDate = formatDateDMY(item.date);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${formattedDate}</td>
                <td>${item.category}</td>
                <td>Rs ${amt.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td class="action-col"><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('totalSpent').innerText = `Rs ${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('totalEntries').innerText = filteredExpenses.length;

        const summaryContainer = document.getElementById('categorySummary');
        summaryContainer.innerHTML = '';
        if (Object.keys(categoryTotals).length === 0) {
            summaryContainer.innerHTML = '<div>No expenses match the filter.</div>';
        } else {
            for (const [cat, sum] of Object.entries(categoryTotals)) {
                const card = document.createElement('div');
                card.className = 'summary-item';
                card.innerHTML = `<strong>${cat}</strong><br><span style="color:#27ae60; font-weight:bold;">Rs ${sum.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>`;
                summaryContainer.appendChild(card);
            }
        }
    }

    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";

        const qtyVal = document.getElementById('qty').value;
        const rateVal = document.getElementById('rate').value;
        let autoDesc = "";

        if (qtyVal && rateVal) {
            autoDesc = `${qtyVal} pcs @ Rs ${rateVal}/pc`;
        }

        const rawSelectedDate = document.getElementById('date').value;
        const isoDate = toISODate(rawSelectedDate);

        const newExpense = {
            date: isoDate,
            category: document.getElementById('category').value,
            description: autoDesc,
            amount: document.getElementById('amount').value
        };

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(newExpense)
            });

            document.getElementById('qty').value = '';
            document.getElementById('rate').value = '';
            document.getElementById('amount').value = '';
            
            setTimeout(loadExpenses, 2000);
        } catch (error) {
            alert("Failed to save expense.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Add Expense";
        }
    });

    async function deleteExpense(index) {
        if (!confirm("Are you sure you want to delete this item?")) return;
        
        document.getElementById('status').innerText = "Deleting...";
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "delete", index: index })
            });
            setTimeout(loadExpenses, 2000);
        } catch (error) {
            alert("Failed to delete expense.");
        }
    }

    function exportToCSV() {
        if (filteredExpenses.length === 0) {
            alert("No data to export!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Date (DD/MM/YYYY),Category,Amount\n";
        filteredExpenses.forEach(e => {
            const formattedDate = formatDateDMY(e.date);
            csvContent += `"${formattedDate}","${e.category}","${e.amount}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `construction_expenses_export.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function generatePDF() {
        window.print();
    }

    loadExpenses();
</script>

</body>
</html>
